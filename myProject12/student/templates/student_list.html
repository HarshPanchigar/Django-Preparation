<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Students</title>
</head>
<body>
    <h1>All Students Data</h1>
    <a href="add/">Add New Student</a>
    <ul>
        {% for s in students %}
        <li>
                <a href="{% url 'student_detail' s.id %}"> {{s.name}} - {{s.email}} </a>
            </li>
            {% endfor %}
    </ul>
</body>
</html>
