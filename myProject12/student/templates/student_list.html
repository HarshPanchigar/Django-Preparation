<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Students</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>All Students</h2>

            <a href="{% url 'student_create' %}" class="btn btn-primary">
                + Add New Student
            </a>
        </div>

        <div class="card shadow">

            <div class="card-body">

                <table class="table table-bordered table-hover table-striped align-middle mb-0">

                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th width="220">Actions</th>
                        </tr>
                    </thead>

                    <tbody>

                        {% for s in students %}

                        <tr>

                            <td>{{ s.id }}</td>

                            <td>{{ s.name }}</td>

                            <td>{{ s.email }}</td>

                            <td>

                                <a href="{% url 'student_detail' s.id %}" class="btn btn-info btn-sm">
                                    View
                                </a>

                                <a href="{% url 'student_edit' s.id %}" class="btn btn-warning btn-sm">
                                    Edit
                                </a>

                                <a href="{% url 'student_delete' s.id %}" class="btn btn-danger btn-sm">
                                    Delete
                                </a>

                            </td>

                        </tr>

                        {% empty %}

                        <tr>
                            <td colspan="4" class="text-center text-muted">
                                No Students Found
                            </td>
                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
