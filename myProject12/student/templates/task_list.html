{% extends "todo/base.html" %}

{% block container %}

<div class="container mt-4">

    <!-- <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Todo List</h2>

        <a href="{% url 'todo:task_add' %}" class="btn btn-primary">
            Add Task
        </a>
    </div> -->

    <table class="table table-striped table-bordered">

        <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Status</th>
                <th>Created</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            {% for task in tasks %}

            <tr>

                <td>{{ task.title }}</td>

                <td>{{ task.description|linebreaksbr }}</td>

                <td>
                    <form method="POST" action="{% url 'todo:task_toggle_complete' task.pk %}">
                        {% csrf_token %}

                        <button type="submit"
                            class="btn btn-sm {% if task.completed %}btn-success{% else %}btn-secondary{% endif %}">

                            {% if task.completed %}
                            Done
                            {% else %}
                            Mark Done
                            {% endif %}

                        </button>
                    </form>
                </td>

                <td>
                    {{ task.created_at|date:"M d, Y H:i" }}
                </td>

                <td>

                    <a href="{% url 'todo:task_edit' task.pk %}" class="btn btn-warning btn-sm">
                        Edit
                    </a>

                    <a href="{% url 'todo:task_delete' task.pk %}" class="btn btn-danger btn-sm">
                        Delete
                    </a>

                </td>

            </tr>

            {% empty %}

            <tr>
                <td colspan="5" class="text-center">
                    No Task Available
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
