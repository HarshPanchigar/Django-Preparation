<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message</title>
</head>
<body>
    <h1>All Message Datas</h1>
    {% if messages %}
    <ul>
        {%for message in messages %}
        <li>
            {{ message }}
        </li>
        {% endfor %}
    </ul>
    {% else %}
        <p>No message found.</p>
    {% endif %}
</body>
</html>
